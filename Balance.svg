<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240"
     font-family="Georgia, 'Times New Roman', Times, serif" font-style="italic">
  <text x="134" y="160" font-size="144" fill="#9B59B6" fill-opacity="0.25">&#8220;</text>
  <text x="215" y="73" font-size="24" fill="#9B59B6">
    <tspan x="215" dy="0">Balance is the most important aspect of life.</tspan>
    <tspan x="215" dy="35">Too much of anything is bad, and too little of</tspan>
    <tspan x="215" dy="35">everything is also bad, so make sure you give it</tspan>
    <tspan x="215" dy="35">your all in maintaining a balanced lifestyle.</tspan>
  </text>
  <text x="690" y="256" font-size="144" fill="#9B59B6" fill-opacity="0.25">&#8221;</text>
</svg>
